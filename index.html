<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Stopwatch</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        place-items: stretch;
      }

      main {
        display: flex;
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(0.75rem, 3vw, 2rem);
        text-align: center;
      }

      #timer-carousel {
        touch-action: pan-y;
      }

      .heading-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: clamp(0.75rem, 4vh, 2rem);
      }

      h1 {
        margin: 0;
        color: #d1d5db;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      #round-status {
        margin: 0;
        color: #9ca3af;
      }

      button.settings-button {
        display: grid;
        width: 2.75rem;
        height: 2.75rem;
        min-width: 0;
        padding: 0;
        place-items: center;
        border-radius: 50%;
      }

      button.settings-button[hidden] {
        display: none;
      }

      .settings-button svg {
        width: 1.25rem;
        height: 1.25rem;
      }

      #display {
        margin: 0;
        font-size: clamp(3rem, min(26vw, 32vh), 18rem);
        font-variant-numeric: tabular-nums;
        font-weight: 300;
        letter-spacing: 0.04em;
        line-height: 1;
      }

      #timer-readout {
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.25em;
        width: 100%;
        margin: auto 0;
      }

      #timer-carousel[data-mode="interval"] #timer-readout {
        font-size: clamp(2.5rem, min(24vw, 30vh), 18rem);
      }

      #timer-carousel[data-mode="interval"] #display {
        font-size: 1em;
      }

      #timer-carousel[data-mode="tabata"] #timer-readout {
        font-size: clamp(2.5rem, min(24vw, 30vh), 18rem);
      }

      #timer-carousel[data-mode="tabata"] #display {
        font-size: 1em;
      }

      #round-status {
        margin: 0;
        font-size: 67%;
        font-variant-numeric: tabular-nums;
      }

      .countdown-overlay {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: grid;
        padding: 1rem;
        place-items: center;
        background: rgb(3 7 18 / 72%);
        pointer-events: none;
      }

      .countdown-overlay[hidden] {
        display: none;
      }

      .countdown-overlay__panel {
        display: grid;
        width: min(100%, 32rem);
        min-width: 0;
        min-height: min(60vw, 24rem);
        padding: clamp(1.5rem, 8vw, 4rem);
        place-items: center;
        background: #111827;
        border: 1px solid #4b5563;
        border-radius: 1.5rem;
        box-shadow: 0 1.5rem 4rem #0009;
      }

      .countdown-overlay__number {
        margin: 0;
        color: #f9fafb;
        font-size: clamp(6rem, 32vw, 18rem);
        font-variant-numeric: tabular-nums;
        font-weight: 800;
        line-height: 0.9;
        transition: opacity 60ms ease-out;
      }

      .countdown-overlay__number.is-blinking {
        opacity: 0;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }

      button {
        min-width: 7rem;
        padding: 0.8rem 1.25rem;
        color: #f9fafb;
        font: inherit;
        font-weight: 600;
        background: #374151;
        border: 1px solid #4b5563;
        border-radius: 999px;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #4b5563;
      }

      button:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 3px;
      }

      button.primary {
        background: #2563eb;
        border-color: #3b82f6;
      }

      button.primary:hover:not(:disabled) {
        background: #1d4ed8;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      dialog {
        width: min(calc(100% - 2rem), 24rem);
        padding: 1.5rem;
        color: #f9fafb;
        background: #1f2937;
        border: 1px solid #4b5563;
        border-radius: 1rem;
        box-shadow: 0 1.5rem 4rem #0008;
      }

      dialog [hidden] {
        display: none !important;
      }

      dialog::backdrop {
        background: #0009;
      }

      dialog h2 {
        margin: 0 0 1.25rem;
        font-size: 1.25rem;
      }

      dialog label {
        display: block;
        margin-bottom: 0.5rem;
        text-align: left;
      }

      dialog input {
        width: 100%;
        padding: 0.75rem;
        color: inherit;
        font: inherit;
        background: #111827;
        border: 1px solid #6b7280;
        border-radius: 0.5rem;
      }

      dialog input:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 2px;
      }

      .settings-error {
        min-height: 1.5em;
        margin: 0.5rem 0;
        color: #fca5a5;
        text-align: left;
      }

      .settings-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.75rem;
        margin-top: 1rem;
      }

      .settings-actions button {
        min-width: 0;
      }

      @media (orientation: landscape) and (max-height: 500px) {
        main {
          padding: 0.5rem 1rem;
        }

        .countdown-overlay__panel {
          min-height: min(70vh, 18rem);
        }

        .countdown-overlay__number {
          font-size: clamp(6rem, 35vh, 18rem);
        }

        #display {
          font-size: clamp(2.5rem, min(18vw, 32vh), 12rem);
        }

        #timer-carousel[data-mode="interval"] #timer-readout {
          font-size: clamp(2.5rem, min(18vw, 32vh), 12rem);
        }

        #timer-carousel[data-mode="tabata"] #timer-readout {
          font-size: clamp(2.5rem, min(18vw, 32vh), 12rem);
        }

        button {
          padding: 0.6rem 1rem;
        }
      }

      @media (max-width: 480px) {
        #timer-carousel[data-mode="interval"] #timer-readout {
          font-size: clamp(2.5rem, 20vw, 12rem);
        }

        #timer-carousel[data-mode="tabata"] #timer-readout {
          font-size: clamp(2.5rem, 20vw, 12rem);
        }
      }
    </style>
  </head>
  <body>
    <main id="timer-carousel" data-mode="stopwatch" role="region" aria-label="Stopwatch" aria-roledescription="carousel" tabindex="0">
      <div class="heading-row">
        <div>
          <h1 id="mode-title">Stopwatch</h1>
        </div>
        <button id="settings-open" class="settings-button" type="button" aria-label="Settings" aria-haspopup="dialog" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M10 2h4l.5 3a7.5 7.5 0 0 1 1.8 1l2.8-1 2 3.5-2.4 2a7.5 7.5 0 0 1 0 3l2.4 2-2 3.5-2.8-1a7.5 7.5 0 0 1-1.8 1L14 22h-4l-.5-3a7.5 7.5 0 0 1-1.8-1l-2.8 1-2-3.5 2.4-2a7.5 7.5 0 0 1 0-3l-2.4-2 2-3.5 2.8 1a7.5 7.5 0 0 1 1.8-1L10 2Z"/>
            <circle cx="12" cy="12" r="3.25" fill="#1f2937"/>
          </svg>
        </button>
      </div>
      <div id="timer-readout">
        <p id="round-status" hidden></p>
        <p id="display" role="timer" aria-label="Elapsed time" aria-live="off">00:00</p>
      </div>
      <div class="controls">
        <button id="start" class="primary" type="button">Start</button>
        <button id="stop" type="button" disabled>Stop</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </main>
    <div id="countdown-overlay" class="countdown-overlay" hidden aria-hidden="true">
      <div class="countdown-overlay__panel">
        <p id="countdown-overlay-number" class="countdown-overlay__number"></p>
      </div>
    </div>
    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <form id="settings-form" novalidate>
        <h2 id="settings-title">Interval settings</h2>
        <div id="interval-settings" hidden>
          <label for="interval-duration">Round duration (mm:ss)</label>
          <input id="interval-duration" name="interval-duration" type="text" inputmode="text" placeholder="01:30" autocomplete="off" spellcheck="false" aria-describedby="settings-error">
          <label for="interval-rounds">Total rounds</label>
          <input id="interval-rounds" name="interval-rounds" type="number" min="1" step="1" inputmode="numeric">
        </div>
        <div id="tabata-settings" hidden>
          <label for="tabata-work-duration">Work duration (mm:ss)</label>
          <input id="tabata-work-duration" name="tabata-work-duration" type="text" inputmode="text" placeholder="00:20" autocomplete="off" spellcheck="false" aria-describedby="settings-error">
          <label for="tabata-rest-duration">Rest duration (mm:ss)</label>
          <input id="tabata-rest-duration" name="tabata-rest-duration" type="text" inputmode="text" placeholder="00:10" autocomplete="off" spellcheck="false" aria-describedby="settings-error">
          <label for="tabata-rounds">Total rounds</label>
          <input id="tabata-rounds" name="tabata-rounds" type="number" min="1" step="1" inputmode="numeric">
        </div>
        <p id="settings-error" class="settings-error" role="alert"></p>
        <div class="settings-actions">
          <button id="settings-cancel" type="button">Cancel</button>
          <button class="primary" type="submit">Apply</button>
        </div>
      </form>
    </dialog>
    <script>
      const display = document.querySelector("#display");
      const countdownOverlay = document.querySelector("#countdown-overlay");
      const countdownOverlayNumber = document.querySelector("#countdown-overlay-number");
      const startButton = document.querySelector("#start");
      const stopButton = document.querySelector("#stop");
      const resetButton = document.querySelector("#reset");
      const settingsOpenButton = document.querySelector("#settings-open");
      const timerCarousel = document.querySelector("#timer-carousel");
      const modeTitle = document.querySelector("#mode-title");
      const roundStatus = document.querySelector("#round-status");
      const settingsDialog = document.querySelector("#settings-dialog");
      const settingsForm = document.querySelector("#settings-form");
      const intervalSettings = document.querySelector("#interval-settings");
      const intervalDurationInput = document.querySelector("#interval-duration");
      const intervalRoundsInput = document.querySelector("#interval-rounds");
      const tabataSettings = document.querySelector("#tabata-settings");
      const tabataWorkDurationInput = document.querySelector("#tabata-work-duration");
      const tabataRestDurationInput = document.querySelector("#tabata-rest-duration");
      const tabataRoundsInput = document.querySelector("#tabata-rounds");
      const settingsError = document.querySelector("#settings-error");

      let elapsedMilliseconds = 0;
      let startedAt = null;
      let intervalId = null;
      let screenWakeLock = null;
      let screenWakeLockRequest = null;
      let screenWakeLockGeneration = 0;
      let screenWakeLockUnavailable = false;
      const STARTUP_COUNTDOWN_SECONDS = 10;
      const COUNTDOWN_BEEP_FREQUENCY = 880;
      const SESSION_START_BEEP_FREQUENCY = 784;
      const COUNTDOWN_BEEP_DURATION_SECONDS = 0.12;
      const SESSION_START_BEEP_DURATION_SECONDS = 0.9;
      const SESSION_START_BEEP_GAIN = 0.24;
      let audioContext = null;
      let playedStartupCueSeconds = new Set();
      let countdownDeadline = null;
      let phase = "idle";
      let hasStarted = false;
      let currentMode = "stopwatch";
      let intervalDurationSeconds = 60;
      let intervalTotalRounds = 1;
      let intervalSessionDurationSeconds = 60;
      let intervalSessionTotalRounds = 1;
      let intervalCurrentRound = 0;
      let intervalRemainingMilliseconds = 60_000;
      let intervalDeadline = null;
      let intervalCountdownDeadline = null;
      let intervalPhase = "idle";
      let tabataWorkDurationSeconds = 20;
      let tabataRestDurationSeconds = 10;
      let tabataTotalRounds = 8;
      let tabataSessionWorkDurationSeconds = 20;
      let tabataSessionRestDurationSeconds = 10;
      let tabataSessionTotalRounds = 8;
      let tabataCurrentRound = 0;
      let tabataPhase = "idle";
      let tabataPausedPhase = null;
      let tabataRemainingMilliseconds = 20_000;
      let tabataDeadline = null;
      let tabataCountdownDeadline = null;
      let pointerStart = null;

      function currentTimerIsActive() {
        if (currentMode === "stopwatch") return phase !== "idle";
        if (currentMode === "interval") {
          return intervalPhase === "running" || intervalPhase === "countdown";
        }
        return ["countdown", "work", "rest"].includes(tabataPhase);
      }

      function switchMode(mode) {
        if (mode === currentMode || currentTimerIsActive()) return;

        currentMode = mode;
        timerCarousel.dataset.mode = mode;
        settingsOpenButton.hidden = mode === "stopwatch";
        const modeName = { stopwatch: "Stopwatch", interval: "Intervals", tabata: "Tabata" }[mode];
        modeTitle.textContent = modeName;
        timerCarousel.setAttribute("aria-label", modeName);
        render();
        updateControls();
      }

      function navigateMode(direction) {
        if (currentTimerIsActive()) return;
        const modes = ["stopwatch", "interval", "tabata"];
        const currentIndex = modes.indexOf(currentMode);
        const nextIndex = currentIndex + (direction === "next" ? 1 : -1);
        if (nextIndex >= 0 && nextIndex < modes.length) switchMode(modes[nextIndex]);
      }

      timerCarousel.addEventListener("keydown", event => {
        if (event.target !== timerCarousel || settingsDialog.open) return;
        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          event.preventDefault();
          navigateMode(event.key === "ArrowRight" ? "next" : "previous");
        }
      });

      timerCarousel.addEventListener("pointerdown", event => {
        if (event.target.closest("button, input, dialog")) {
          pointerStart = null;
          return;
        }
        pointerStart = { x: event.clientX, y: event.clientY };
      });
      timerCarousel.addEventListener("pointerup", event => {
        if (pointerStart === null) return;
        const deltaX = event.clientX - pointerStart.x;
        const deltaY = event.clientY - pointerStart.y;
        pointerStart = null;
        if (Math.abs(deltaX) < 50 || Math.abs(deltaX) < Math.abs(deltaY) * 1.2) return;
        navigateMode(deltaX < 0 ? "next" : "previous");
      });
      timerCarousel.addEventListener("pointercancel", () => {
        pointerStart = null;
      });

      function openSettings() {
        intervalDurationInput.value = formatTime(intervalDurationSeconds);
        intervalRoundsInput.value = String(intervalTotalRounds);
        tabataWorkDurationInput.value = formatTime(tabataWorkDurationSeconds);
        tabataRestDurationInput.value = formatTime(tabataRestDurationSeconds);
        tabataRoundsInput.value = String(tabataTotalRounds);
        const isInterval = currentMode === "interval";
        document.querySelector("#settings-title").textContent =
          isInterval ? "Interval settings" : "Tabata settings";
        intervalSettings.hidden = !isInterval;
        tabataSettings.hidden = currentMode !== "tabata";
        settingsError.textContent = "";
        settingsDialog.showModal();
        (isInterval ? intervalDurationInput : tabataWorkDurationInput).focus();
      }

      function applySettings(event) {
        event.preventDefault();
        if (currentMode === "interval") {
          const durationValue = intervalDurationInput.value.trim();
          const roundsValue = intervalRoundsInput.value.trim();
          const durationMatch = /^(\d+):(\d{2})$/.exec(durationValue);
          const rounds = Number(roundsValue);
          const minutes = durationMatch === null ? NaN : Number(durationMatch[1]);
          const seconds = durationMatch === null ? NaN : Number(durationMatch[2]);
          const durationSeconds = minutes * 60 + seconds;
          const validDuration = durationMatch !== null
            && Number.isSafeInteger(minutes)
            && seconds <= 59
            && Number.isSafeInteger(durationSeconds)
            && durationSeconds > 0
            && Number.isSafeInteger(durationSeconds * 1000);
          const validRounds = /^\d+$/.test(roundsValue)
            && Number.isSafeInteger(rounds)
            && rounds > 0;
          if (!validDuration || !validRounds) {
            settingsError.textContent =
              "Enter a positive duration as minutes:seconds (for example, 1:30) and a positive whole number of rounds.";
            intervalDurationInput.focus();
            return;
          }

          intervalDurationSeconds = durationSeconds;
          intervalTotalRounds = rounds;
          if (intervalPhase !== "running" && intervalPhase !== "paused" && intervalPhase !== "countdown") {
            intervalCurrentRound = 0;
            intervalRemainingMilliseconds = intervalDurationSeconds * 1000;
            intervalSessionDurationSeconds = intervalDurationSeconds;
            intervalSessionTotalRounds = intervalTotalRounds;
            intervalDeadline = null;
            intervalPhase = "idle";
          }
        } else {
          const workDuration = parseDuration(tabataWorkDurationInput.value);
          const restDuration = parseDuration(tabataRestDurationInput.value);
          const roundsValue = tabataRoundsInput.value.trim();
          const rounds = Number(roundsValue);

          if (workDuration === null || restDuration === null) {
            settingsError.textContent =
              "Enter positive work and rest durations as minutes:seconds (for example, 0:20).";
            (workDuration === null ? tabataWorkDurationInput : tabataRestDurationInput).focus();
            return;
          }
          if (!/^\d+$/.test(roundsValue) || !Number.isSafeInteger(rounds) || rounds <= 0) {
            settingsError.textContent = "Enter a positive whole number of rounds.";
            tabataRoundsInput.focus();
            return;
          }
          tabataWorkDurationSeconds = workDuration;
          tabataRestDurationSeconds = restDuration;
          tabataTotalRounds = rounds;
          if (!["countdown", "work", "rest", "paused"].includes(tabataPhase)) {
            tabataCurrentRound = 0;
            tabataRemainingMilliseconds = tabataWorkDurationSeconds * 1000;
            tabataSessionWorkDurationSeconds = tabataWorkDurationSeconds;
            tabataSessionRestDurationSeconds = tabataRestDurationSeconds;
            tabataSessionTotalRounds = tabataTotalRounds;
            tabataDeadline = null;
            tabataCountdownDeadline = null;
            tabataPhase = "idle";
          }
        }

        settingsDialog.close();
        settingsOpenButton.focus();
        render();
      }

      function renderStopwatch() {
        if (phase === "countdown") {
          const now = Date.now();
          const remainingMilliseconds = countdownDeadline - now;

          if (remainingMilliseconds <= 0) {
            playSessionStartCue();
            phase = "running";
            hasStarted = true;
            startedAt = countdownDeadline;
            countdownDeadline = null;
          } else {
            const remainingSeconds = Math.ceil(remainingMilliseconds / 1000);
            playStartupCountdownCue(remainingSeconds);
            display.textContent = formatTime(remainingSeconds);
            display.setAttribute("aria-label", "Countdown remaining");
            renderStartupCountdownOverlay(countdownDeadline, now);
            return;
          }
        }

        renderStartupCountdownOverlay(null);
        const elapsed = elapsedMilliseconds
          + (phase === "running" && startedAt !== null ? Date.now() - startedAt : 0);
        display.textContent = formatTime(Math.floor(elapsed / 1000));
        display.setAttribute("aria-label", "Elapsed time");
        roundStatus.hidden = true;
      }

      function formatTime(totalSeconds) {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      function renderStartupCountdownOverlay(deadline, now = Date.now()) {
        countdownOverlay.hidden = deadline === null;
        if (deadline === null) {
          countdownOverlayNumber.textContent = "";
          countdownOverlayNumber.classList.remove("is-blinking");
          return;
        }

        const remainingMilliseconds = Math.max(0, deadline - now);
        const elapsedMilliseconds = STARTUP_COUNTDOWN_SECONDS * 1000 - remainingMilliseconds;
        countdownOverlayNumber.textContent = String(Math.ceil(remainingMilliseconds / 1000));
        countdownOverlayNumber.classList.toggle(
          "is-blinking",
          elapsedMilliseconds % 1000 >= 850
        );
      }

      function parseDuration(value) {
        const match = /^(\d+):(\d{2})$/.exec(value.trim());
        if (match === null) return null;
        const minutes = Number(match[1]);
        const seconds = Number(match[2]);
        const duration = minutes * 60 + seconds;
        return Number.isSafeInteger(minutes)
          && seconds <= 59
          && Number.isSafeInteger(duration)
          && duration > 0
          && Number.isSafeInteger(duration * 1000)
          ? duration
          : null;
      }

      function initializeAudioContext() {
        const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
        if (typeof AudioContextConstructor !== "function") {
          console.warn("Web Audio API is not supported; startup sounds are unavailable.");
          return;
        }

        if (audioContext === null) {
          try {
            audioContext = new AudioContextConstructor();
          } catch (error) {
            console.warn("Unable to initialize audio context:", error);
            return;
          }
        }

        if (audioContext.state === "suspended") {
          void audioContext.resume().catch(error => {
            console.warn("Unable to resume audio context:", error);
          });
        }
      }

      function playBeep(frequency, durationSeconds, peakGain = 0.2) {
        if (audioContext === null || audioContext.state !== "running") return;

        try {
          const startTime = audioContext.currentTime;
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(frequency, startTime);
          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + durationSeconds);
          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(startTime);
          oscillator.stop(startTime + durationSeconds);
        } catch (error) {
          console.warn("Unable to play timer cue:", error);
        }
      }

      function playStartupCountdownCue(secondsRemaining) {
        if (
          secondsRemaining < 1
          || secondsRemaining > 3
          || playedStartupCueSeconds.has(secondsRemaining)
        ) {
          return;
        }

        playedStartupCueSeconds.add(secondsRemaining);
        playBeep(COUNTDOWN_BEEP_FREQUENCY, COUNTDOWN_BEEP_DURATION_SECONDS);
      }

      function resetStartupCueProgress() {
        playedStartupCueSeconds = new Set();
      }

      function playSessionStartCue() {
        playBeep(
          SESSION_START_BEEP_FREQUENCY,
          SESSION_START_BEEP_DURATION_SECONDS,
          SESSION_START_BEEP_GAIN
        );
      }

      function updateInterval(now) {
        if (intervalPhase === "countdown") {
          if (intervalCountdownDeadline === null || now < intervalCountdownDeadline) return;
          intervalDeadline = intervalCountdownDeadline + intervalSessionDurationSeconds * 1000;
          intervalCountdownDeadline = null;
          intervalPhase = "running";
          playSessionStartCue();
        }
        if (intervalPhase !== "running" || intervalDeadline === null || now < intervalDeadline) return;

        const durationMilliseconds = intervalSessionDurationSeconds * 1000;
        const completedRounds = Math.floor((now - intervalDeadline) / durationMilliseconds) + 1;
        if (intervalCurrentRound + completedRounds > intervalSessionTotalRounds) {
          intervalCurrentRound = intervalSessionTotalRounds;
          intervalRemainingMilliseconds = 0;
          intervalDeadline = null;
          intervalPhase = "complete";
          updateControls();
          return;
        }

        intervalCurrentRound += completedRounds;
        intervalDeadline += completedRounds * durationMilliseconds;
        intervalRemainingMilliseconds = intervalDeadline - now;
      }

      function renderInterval() {
        const now = Date.now();
        updateInterval(now);
        const sessionActive = intervalPhase === "running"
          || intervalPhase === "paused"
          || intervalPhase === "countdown"
          || intervalPhase === "complete";
        const durationSeconds = sessionActive ? intervalSessionDurationSeconds : intervalDurationSeconds;
        const totalRounds = sessionActive ? intervalSessionTotalRounds : intervalTotalRounds;
        const remainingMilliseconds = intervalPhase === "countdown" && intervalCountdownDeadline !== null
          ? Math.max(0, intervalCountdownDeadline - now)
          : intervalPhase === "running" && intervalDeadline !== null
            ? Math.max(0, intervalDeadline - now)
            : intervalRemainingMilliseconds;
        const remainingSeconds = Math.ceil(remainingMilliseconds / 1000);

        renderStartupCountdownOverlay(
          intervalPhase === "countdown" ? intervalCountdownDeadline : null,
          now
        );
        if (intervalPhase === "countdown") playStartupCountdownCue(remainingSeconds);
        display.textContent = formatTime(remainingSeconds);
        roundStatus.hidden = false;
        roundStatus.textContent =
          `${intervalPhase === "complete" ? totalRounds : intervalCurrentRound || 1} of ${totalRounds}`;
        display.setAttribute(
          "aria-label",
          intervalPhase === "complete"
            ? "Interval complete, 00:00 remaining"
            : `Time remaining, round ${intervalCurrentRound || 1} of ${totalRounds}`
        );

        if (intervalPhase === "idle") {
          display.textContent = formatTime(durationSeconds);
          display.setAttribute("aria-label", "Interval duration");
        }
      }

      function updateTabata(now) {
        if (tabataPhase === "countdown") {
          if (tabataCountdownDeadline === null || now < tabataCountdownDeadline) return;
          tabataDeadline =
            tabataCountdownDeadline + tabataSessionWorkDurationSeconds * 1000;
          tabataCountdownDeadline = null;
          tabataPhase = "work";
          playSessionStartCue();
        }

        while (
          (tabataPhase === "work" || tabataPhase === "rest")
          && tabataDeadline !== null
          && now >= tabataDeadline
        ) {
          if (tabataPhase === "work") {
            tabataPhase = "rest";
            tabataDeadline += tabataSessionRestDurationSeconds * 1000;
          } else if (tabataCurrentRound === tabataSessionTotalRounds) {
            tabataPhase = "complete";
            tabataDeadline = null;
            tabataRemainingMilliseconds = 0;
            updateControls();
          } else {
            tabataCurrentRound += 1;
            tabataPhase = "work";
            tabataDeadline += tabataSessionWorkDurationSeconds * 1000;
          }
        }
      }

      function renderTabata() {
        const now = Date.now();
        updateTabata(now);
        const visiblePhase = tabataPhase === "paused" ? tabataPausedPhase : tabataPhase;
        const currentRound = tabataPhase === "idle" ? 1 : tabataCurrentRound || 1;
        const remainingMilliseconds = tabataPhase === "countdown" && tabataCountdownDeadline !== null
          ? Math.max(0, tabataCountdownDeadline - now)
          : (tabataPhase === "work" || tabataPhase === "rest") && tabataDeadline !== null
            ? Math.max(0, tabataDeadline - now)
            : tabataPhase === "paused"
              ? tabataRemainingMilliseconds
              : visiblePhase === "rest"
                ? tabataSessionRestDurationSeconds * 1000
                : tabataWorkDurationSeconds * 1000;
        const phaseLabel = {
          countdown: "Starting",
          work: "Work",
          rest: "Rest",
          paused: "Paused",
          complete: "Complete",
          idle: "Work"
        }[visiblePhase];

        const remainingSeconds = Math.ceil(remainingMilliseconds / 1000);
        renderStartupCountdownOverlay(
          tabataPhase === "countdown" ? tabataCountdownDeadline : null,
          now
        );
        if (tabataPhase === "countdown") playStartupCountdownCue(remainingSeconds);
        display.textContent = formatTime(remainingSeconds);
        roundStatus.hidden = false;
        roundStatus.textContent = `${currentRound} of ${tabataPhase === "idle" ? tabataTotalRounds : tabataSessionTotalRounds}`;
        display.setAttribute(
          "aria-label",
          `${tabataPhase === "paused" ? "Paused, " : ""}${phaseLabel}, ${formatTime(Math.ceil(remainingMilliseconds / 1000))} remaining, round ${currentRound} of ${tabataPhase === "idle" ? tabataTotalRounds : tabataSessionTotalRounds}`
        );
        if (tabataPhase === "idle") {
          display.setAttribute("aria-label", `Work duration, ${formatTime(tabataWorkDurationSeconds)}`);
        } else if (tabataPhase === "complete") {
          display.textContent = "00:00";
          display.setAttribute("aria-label", `Tabata complete, round ${tabataSessionTotalRounds} of ${tabataSessionTotalRounds}`);
        }
      }

      function render() {
        if (currentMode === "stopwatch") renderStopwatch();
        else if (currentMode === "interval") renderInterval();
        else renderTabata();
        if (!timerIsRunning()) stopRefresh();
        syncScreenWakeLock();
      }

      function timerIsRunning() {
        if (currentMode === "stopwatch") return phase !== "idle";
        if (currentMode === "interval") {
          return intervalPhase === "running" || intervalPhase === "countdown";
        }
        return ["countdown", "work", "rest"].includes(tabataPhase);
      }

      function updateControls() {
        const active = timerIsRunning();
        startButton.disabled = active;
        stopButton.disabled = !active;
      }

      function startRefresh() {
        if (intervalId === null) {
          intervalId = window.setInterval(render, 100);
        }
      }

      function stopRefresh() {
        if (intervalId !== null) {
          window.clearInterval(intervalId);
          intervalId = null;
        }
      }

      function releaseScreenWakeLockSentinel(sentinel) {
        if (sentinel.released) return Promise.resolve();
        return sentinel.release().catch(error => {
          console.warn("Unable to release screen wake lock:", error);
        });
      }

      function releaseScreenWakeLock() {
        const hasPendingRequest = screenWakeLockRequest !== null;
        const sentinel = screenWakeLock;
        screenWakeLock = null;
        screenWakeLockUnavailable = false;

        if (hasPendingRequest || sentinel !== null) screenWakeLockGeneration += 1;
        if (sentinel !== null) void releaseScreenWakeLockSentinel(sentinel);
      }

      function syncScreenWakeLock() {
        if (!timerIsRunning() || document.visibilityState !== "visible") {
          releaseScreenWakeLock();
          return;
        }
        if (typeof navigator.wakeLock?.request !== "function") return;
        if (screenWakeLockUnavailable || screenWakeLock !== null || screenWakeLockRequest !== null) return;

        const requestGeneration = screenWakeLockGeneration;
        let request;
        try {
          request = navigator.wakeLock.request("screen");
        } catch (error) {
          screenWakeLockUnavailable = true;
          console.warn("Unable to acquire screen wake lock:", error);
          return;
        }

        screenWakeLockRequest = request;
        request.then(sentinel => {
          if (screenWakeLockRequest === request) screenWakeLockRequest = null;
          if (
            requestGeneration !== screenWakeLockGeneration
            || !timerIsRunning()
            || document.visibilityState !== "visible"
          ) {
            void releaseScreenWakeLockSentinel(sentinel).then(syncScreenWakeLock);
            return;
          }

          screenWakeLock = sentinel;
          sentinel.addEventListener("release", () => {
            if (screenWakeLock === sentinel) screenWakeLock = null;
            if (document.visibilityState === "visible" && timerIsRunning()) syncScreenWakeLock();
          }, { once: true });
        }).catch(error => {
          if (screenWakeLockRequest === request) screenWakeLockRequest = null;
          if (
            requestGeneration === screenWakeLockGeneration
            && timerIsRunning()
            && document.visibilityState === "visible"
          ) {
            screenWakeLockUnavailable = true;
            console.warn("Unable to acquire screen wake lock:", error);
          }
        });
      }

      function startStopwatch() {
        if (phase !== "idle") return;

        if (!hasStarted && elapsedMilliseconds === 0) {
          resetStartupCueProgress();
          phase = "countdown";
          countdownDeadline = Date.now() + STARTUP_COUNTDOWN_SECONDS * 1000;
        } else {
          phase = "running";
          hasStarted = true;
          startedAt = Date.now();
        }
      }

      function startInterval() {
        if (intervalPhase === "running" || intervalPhase === "countdown") return;
        if (intervalPhase !== "paused") {
          intervalSessionDurationSeconds = intervalDurationSeconds;
          intervalSessionTotalRounds = intervalTotalRounds;
          intervalCurrentRound = 1;
          intervalRemainingMilliseconds = intervalSessionDurationSeconds * 1000;
          intervalDeadline = null;
          resetStartupCueProgress();
          intervalCountdownDeadline = Date.now() + STARTUP_COUNTDOWN_SECONDS * 1000;
          intervalPhase = "countdown";
          return;
        }
        intervalCountdownDeadline = null;
        intervalDeadline = Date.now() + intervalRemainingMilliseconds;
        intervalPhase = "running";
      }

      function startTabata() {
        if (["countdown", "work", "rest"].includes(tabataPhase)) return;
        if (tabataPhase === "paused") {
          tabataPhase = tabataPausedPhase;
          tabataDeadline = Date.now() + tabataRemainingMilliseconds;
          tabataPausedPhase = null;
          return;
        }

        tabataSessionWorkDurationSeconds = tabataWorkDurationSeconds;
        tabataSessionRestDurationSeconds = tabataRestDurationSeconds;
        tabataSessionTotalRounds = tabataTotalRounds;
        tabataCurrentRound = 1;
        tabataRemainingMilliseconds = tabataSessionWorkDurationSeconds * 1000;
        tabataDeadline = null;
        resetStartupCueProgress();
        tabataCountdownDeadline = Date.now() + STARTUP_COUNTDOWN_SECONDS * 1000;
        tabataPhase = "countdown";
      }

      function start() {
        initializeAudioContext();
        if (currentMode === "stopwatch") startStopwatch();
        else if (currentMode === "interval") startInterval();
        else startTabata();
        render();
        if (timerIsRunning()) startRefresh();
        updateControls();
      }

      function stopStopwatch() {
        if (phase === "idle") return;
        if (phase === "countdown") resetStartupCueProgress();
        if (phase === "running" && startedAt !== null) {
          elapsedMilliseconds += Date.now() - startedAt;
        }
        startedAt = null;
        countdownDeadline = null;
        phase = "idle";
      }

      function stopInterval() {
        if (intervalPhase === "countdown") {
          resetStartupCueProgress();
          intervalCountdownDeadline = null;
          intervalCurrentRound = 0;
          intervalRemainingMilliseconds = intervalDurationSeconds * 1000;
          intervalSessionDurationSeconds = intervalDurationSeconds;
          intervalSessionTotalRounds = intervalTotalRounds;
          intervalPhase = "idle";
          return;
        }
        if (intervalPhase !== "running") return;
        updateInterval(Date.now());
        if (intervalPhase === "running" && intervalDeadline !== null) {
          intervalRemainingMilliseconds = Math.max(0, intervalDeadline - Date.now());
          intervalDeadline = null;
          intervalPhase = "paused";
        }
      }

      function stopTabata() {
        if (tabataPhase === "countdown") {
          resetStartupCueProgress();
          tabataCountdownDeadline = null;
          tabataDeadline = null;
          tabataCurrentRound = 0;
          tabataRemainingMilliseconds = tabataWorkDurationSeconds * 1000;
          tabataSessionWorkDurationSeconds = tabataWorkDurationSeconds;
          tabataSessionRestDurationSeconds = tabataRestDurationSeconds;
          tabataSessionTotalRounds = tabataTotalRounds;
          tabataPhase = "idle";
          return;
        }
        if (tabataPhase !== "work" && tabataPhase !== "rest") return;
        updateTabata(Date.now());
        if (tabataPhase !== "work" && tabataPhase !== "rest") return;
        tabataPausedPhase = tabataPhase;
        tabataRemainingMilliseconds = Math.max(0, tabataDeadline - Date.now());
        tabataDeadline = null;
        tabataPhase = "paused";
      }

      function stop() {
        if (currentMode === "stopwatch") stopStopwatch();
        else if (currentMode === "interval") stopInterval();
        else stopTabata();
        if (!timerIsRunning()) stopRefresh();
        render();
        updateControls();
      }

      function resetStopwatch() {
        elapsedMilliseconds = 0;
        startedAt = null;
        countdownDeadline = null;
        phase = "idle";
        hasStarted = false;
      }

      function resetInterval() {
        intervalDeadline = null;
        intervalCountdownDeadline = null;
        intervalCurrentRound = 0;
        intervalRemainingMilliseconds = intervalDurationSeconds * 1000;
        intervalSessionDurationSeconds = intervalDurationSeconds;
        intervalSessionTotalRounds = intervalTotalRounds;
        intervalPhase = "idle";
      }

      function resetTabata() {
        tabataDeadline = null;
        tabataCountdownDeadline = null;
        tabataPausedPhase = null;
        tabataCurrentRound = 0;
        tabataRemainingMilliseconds = tabataWorkDurationSeconds * 1000;
        tabataSessionWorkDurationSeconds = tabataWorkDurationSeconds;
        tabataSessionRestDurationSeconds = tabataRestDurationSeconds;
        tabataSessionTotalRounds = tabataTotalRounds;
        tabataPhase = "idle";
      }

      function reset() {
        resetStartupCueProgress();
        if (currentMode === "stopwatch") resetStopwatch();
        else if (currentMode === "interval") resetInterval();
        else resetTabata();
        if (!timerIsRunning()) stopRefresh();
        render();
        updateControls();
      }

      startButton.addEventListener("click", start);
      stopButton.addEventListener("click", stop);
      resetButton.addEventListener("click", reset);
      settingsOpenButton.addEventListener("click", openSettings);
      settingsForm.addEventListener("submit", applySettings);
      document.querySelector("#settings-cancel").addEventListener("click", () => {
        settingsDialog.close();
        settingsOpenButton.focus();
      });
      settingsDialog.addEventListener("click", event => {
        if (event.target === settingsDialog) settingsDialog.close();
      });
      document.addEventListener("visibilitychange", syncScreenWakeLock);
      render();
      updateControls();
    </script>
  </body>
</html>
