<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Stopwatch</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 1.5rem;
      }

      main {
        width: min(100%, 32rem);
        padding: clamp(2rem, 8vw, 4rem);
        text-align: center;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 1.5rem;
        box-shadow: 0 1.5rem 4rem #0004;
      }

      h1 {
        margin: 0 0 2rem;
        color: #d1d5db;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      #display {
        margin: 0 0 2.5rem;
        font-size: clamp(4rem, 18vw, 7rem);
        font-variant-numeric: tabular-nums;
        font-weight: 300;
        letter-spacing: 0.04em;
        line-height: 1;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }

      button {
        min-width: 7rem;
        padding: 0.8rem 1.25rem;
        color: #f9fafb;
        font: inherit;
        font-weight: 600;
        background: #374151;
        border: 1px solid #4b5563;
        border-radius: 999px;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #4b5563;
      }

      button:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 3px;
      }

      button.primary {
        background: #2563eb;
        border-color: #3b82f6;
      }

      button.primary:hover:not(:disabled) {
        background: #1d4ed8;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Stopwatch</h1>
      <p id="display" role="timer" aria-label="Elapsed time" aria-live="off">00:00</p>
      <div class="controls">
        <button id="start" class="primary" type="button">Start</button>
        <button id="stop" type="button" disabled>Stop</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </main>
    <script>
      const display = document.querySelector("#display");
      const startButton = document.querySelector("#start");
      const stopButton = document.querySelector("#stop");
      const resetButton = document.querySelector("#reset");

      let elapsedMilliseconds = 0;
      let startedAt = null;
      let intervalId = null;

      function render() {
        const elapsed = elapsedMilliseconds
          + (startedAt === null ? 0 : Date.now() - startedAt);
        const totalSeconds = Math.floor(elapsed / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        display.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      function start() {
        if (startedAt !== null) return;

        startedAt = Date.now();
        render();
        intervalId = window.setInterval(render, 100);
        startButton.disabled = true;
        stopButton.disabled = false;
      }

      function stop() {
        if (startedAt === null) return;

        elapsedMilliseconds += Date.now() - startedAt;
        startedAt = null;
        window.clearInterval(intervalId);
        intervalId = null;
        render();
        startButton.disabled = false;
        stopButton.disabled = true;
      }

      function reset() {
        if (intervalId !== null) {
          window.clearInterval(intervalId);
          intervalId = null;
        }
        elapsedMilliseconds = 0;
        startedAt = null;
        render();
        startButton.disabled = false;
        stopButton.disabled = true;
      }

      startButton.addEventListener("click", start);
      stopButton.addEventListener("click", stop);
      resetButton.addEventListener("click", reset);
      render();
    </script>
  </body>
</html>
